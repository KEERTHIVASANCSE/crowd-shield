# ==========================================
# MySQL Database Profile Configuration
# Activate via: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: java -jar target/crowdshield-0.0.1-SNAPSHOT.jar --spring.profiles.active=mysql
# ==========================================

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/crowdshield?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
