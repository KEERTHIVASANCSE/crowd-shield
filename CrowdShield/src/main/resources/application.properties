# ==========================================
# CrowdShield Backend Configuration
# ==========================================

# Server Configuration
server.port=8080

# Default Database Configuration
# Uses embedded H2 with MySQL compatibility mode for instant out-of-the-box local execution.
# To connect to MySQL instead, set environment variable SPRING_DATASOURCE_URL or use spring.profiles.active=mysql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/crowdshield;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hikari Connection Pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable legacy data.sql execution in favor of DataInitializer bean
spring.sql.init.mode=never

# H2 Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CORS Configuration
# Allow all common frontend ports and deployed domains
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging Configuration
logging.level.com.crowdshield=INFO
logging.level.org.springframework.web=INFO